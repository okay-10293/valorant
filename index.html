<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>발로란트 리스폰 뮤직</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 좌측: 캡처 소스 + 미리보기 + 영역 지정 -->
    <div class="panel left">
      <h2>1. 캡처할 화면 선택</h2>
      <select id="sourceSelect"></select>
      <button id="refreshSources">새로고침</button>

      <h2>2. 감지 영역 (자동 설정됨)</h2>
      <p class="hint">기본값으로 죽었을 때 뜨는 "플레이어 변경" UI 위치가 이미 지정되어 있습니다. 아래 미리보기에 초록 박스로 표시됩니다.</p>
      <div class="canvas-wrap">
        <canvas id="preview" width="480" height="270"></canvas>
        <canvas id="overlay" width="480" height="270"></canvas>
      </div>

      <div class="status-row">
        <span>현재 판정: </span>
        <span id="stateLabel" class="state-badge alive">ALIVE</span>
      </div>
      <div class="debug-row">
        <span id="debugColor">-</span>
      </div>

      <details class="advanced">
        <summary>⚙ 고급: 감지가 잘 안 맞으면 직접 재보정</summary>
        <p class="hint">해상도/UI 스케일이 달라서 기본값이 안 맞을 때만 사용하세요.
        미리보기 위에서 "플레이어 변경" UI가 뜨는 부분을 드래그로 다시 지정한 뒤,
        게임에서 실제로 살아있을 때/죽었을 때 각각 버튼을 눌러 저장하세요.</p>
        <div class="calib-row">
          <button id="calibAlive">🟢 살아있을 때 저장</button>
          <button id="calibDead">🔴 죽었을 때 저장</button>
        </div>
        <button id="resetDefaults">기본값으로 초기화</button>
      </details>
    </div>

    <!-- 우측: 유튜브 + 볼륨 설정 -->
    <div class="panel right">
      <h2>유튜브</h2>
      <div class="yt-input-row">
        <input id="ytUrl" type="text" placeholder="유튜브 URL 또는 영상 ID 붙여넣기" />
        <button id="loadYt">불러오기</button>
      </div>
      <div id="player"></div>

      <h2>볼륨 설정</h2>
      <div class="slider-row">
        <label>평소(생존) 볼륨: <span id="quietVal">20</span>%</label>
        <input type="range" id="quietVolume" min="0" max="100" value="20" />
      </div>
      <div class="slider-row">
        <label>사망 시 볼륨: <span id="loudVal">80</span>%</label>
        <input type="range" id="loudVolume" min="0" max="100" value="80" />
      </div>
      <div class="slider-row">
        <label>전환 속도(페이드): <span id="fadeVal">800</span>ms</label>
        <input type="range" id="fadeDuration" min="100" max="3000" step="100" value="800" />
      </div>
      <div class="slider-row">
        <label>감지 민감도(연속 프레임): <span id="confirmVal">3</span></label>
        <input type="range" id="confirmFrames" min="1" max="10" value="3" />
      </div>

      <div class="toggle-row">
        <label><input type="checkbox" id="detectionToggle" /> 감지 시작</label>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="renderer.js"></script>
</body>
</html>
